<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Logic</title>
	<script src="logic/index.js"></script>
</head>
<body>
	<p>Only propositional logic is supported for now. Operators: <code>~</code> (not), <code>&</code> (and), <code>|</code> (or), <code>-&gt;</code> (then), and <code>&lt;-&gt;</code> (biconditional, implemented as an alias for <code>(a -> b) & (b -> a)</code>).</p>
	<div>
		<label for="formula">Enter your formula:</label>
		<input type="text" name="formula" id="formula" oninput="parseFormula()" />
	</div>
	<div>
		<label for="parsed-formula">Parsed formula:</label>
		<input type="text" name="parsed-formula" id="parsed-formula" disabled />
		<span id="parse-errors"></span>
	</div>
	<p>Actions:</p>
	<div>
		<button onclick="listPropositions()">List propositions</button>
		<button onclick="counterexampleSearch()">Counterexample search</button>
		<button onclick="counterexampleSearch(true)">Counterexample search (verbose)</button>
	</div>
	<pre id="output"></pre>

	<script>
		parseFormula();
	</script>
</body>
</html>
